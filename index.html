<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Suvam Construction - Coming Soon</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    height: 100vh;
    background: linear-gradient(135deg, #1c1c1c, #2c3e50);
    display: flex;
    justify-content: center;
    align-items: center;
    color: #fff;
    text-align: center;
}

.container {
    max-width: 600px;
    padding: 20px;
}

.logo {
    font-size: 32px;
    font-weight: bold;
    margin-bottom: 20px;
}

.logo span {
    color: #f39c12;
}

h1 {
    font-size: 48px;
    margin-bottom: 10px;
}

p {
    color: #ccc;
    margin-bottom: 30px;
}

.countdown {
    display: flex;
    justify-content: center;
    gap: 20px;
    margin-bottom: 30px;
}

.time-box {
    background: rgba(255,255,255,0.1);
    padding: 15px 20px;
    border-radius: 10px;
    min-width: 70px;
}

.time-box h2 {
    font-size: 28px;
}

.time-box span {
    font-size: 12px;
    color: #aaa;
}

.loader {
    width: 50px;
    height: 50px;
    border: 5px solid rgba(255,255,255,0.2);
    border-top: 5px solid #f39c12;
    border-radius: 50%;
    animation: spin 1s linear infinite;
    margin: auto;
}

@keyframes spin {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
}

.footer {
    position: absolute;
    bottom: 20px;
    font-size: 14px;
    color: #aaa;
}
</style>
</head>

<body>

<div class="container">
    <div class="logo">SUVAM <span>CONSTRUCTION</span></div>

    <h1>Coming Soon</h1>
    <p>We are building something strong & reliable.</p>

    <div class="countdown">
        <div class="time-box">
            <h2 id="days">00</h2>
            <span>Days</span>
        </div>
        <div class="time-box">
            <h2 id="hours">00</h2>
            <span>Hours</span>
        </div>
        <div class="time-box">
            <h2 id="minutes">00</h2>
            <span>Minutes</span>
        </div>
        <div class="time-box">
            <h2 id="seconds">00</h2>
            <span>Seconds</span>
        </div>
    </div>

    <div class="loader"></div>
</div>

<div class="footer">
    © 2026 Suvam Construction. All Rights Reserved.
</div>

<script>
// 7 DAYS COUNTDOWN FROM FIRST LOAD (WITH LOCAL STORAGE)

let savedDate = localStorage.getItem("launchDate");

if (!savedDate) {
    let now = new Date().getTime();
    let future = now + (7 * 24 * 60 * 60 * 1000); // 7 days
    localStorage.setItem("launchDate", future);
    savedDate = future;
}

const launchDate = parseInt(savedDate);

const timer = setInterval(function() {
    const now = new Date().getTime();
    const distance = launchDate - now;

    const days = Math.floor(distance / (1000 * 60 * 60 * 24));
    const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
    const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
    const seconds = Math.floor((distance % (1000 * 60)) / 1000);

    document.getElementById("days").innerHTML = days;
    document.getElementById("hours").innerHTML = hours;
    document.getElementById("minutes").innerHTML = minutes;
    document.getElementById("seconds").innerHTML = seconds;

    if (distance < 0) {
        clearInterval(timer);
        document.querySelector(".countdown").innerHTML = "Website is Live 🚀";
    }
}, 1000);
</script>

</body>
</html>
